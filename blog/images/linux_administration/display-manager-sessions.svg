<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Display manager launching X11 or Wayland sessions</title>
  <desc id="desc">A display manager starts either an X11 session, using an Xorg server and a desktop or window manager, or a Wayland session, using a compositor such as Mutter, KWin, or Sway.</desc>
  <rect x="15" y="15" width="1070" height="650" rx="18" fill="#fcfcfc" stroke="#ddd"/>
  <g fill="none" stroke="#111" stroke-width="5">
    <path d="M550 160V220M295 280V220H805V280M295 410V470M805 410V470"/>
  </g>
  <rect x="310" y="50" width="480" height="110" rx="22" fill="#64748b"/>
  <rect x="70" y="280" width="450" height="130" rx="22" fill="#2563eb"/>
  <rect x="580" y="280" width="450" height="130" rx="22" fill="#0d9488"/>
  <rect x="70" y="470" width="450" height="145" rx="20" fill="#e2e9fb" stroke="#2563eb" stroke-width="3"/>
  <rect x="580" y="470" width="450" height="145" rx="20" fill="#e2efed" stroke="#0d9488" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="white" font-size="40">
      <text x="550" y="117" font-weight="700">Display Manager</text>
      <text x="295" y="360">X11 Session</text>
      <text x="805" y="360">Wayland Session</text>
    </g>
    <g fill="#111" font-size="34">
      <text x="295" y="530">Xorg Server</text>
      <text x="295" y="578">Desktop / WM</text>
      <text x="805" y="530">Wayland Compositor</text>
      <text x="805" y="578" font-size="30">Mutter / KWin / Sway</text>
    </g>
  </g>
</svg>
